name: runwards
description: "Runwards - Watch and Earn RC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Core
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  
  # Backend
  supabase_flutter: ^2.5.0
  firebase_messaging: ^15.0.0
  
  # Features
  health: ^10.0.0
  google_mobile_ads: ^5.0.0
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  permission_handler: ^11.3.1
  firebase_core: ^3.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
